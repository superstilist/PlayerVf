name: PlayerVf
description: "A cross-platform music player with system music folder scanning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Audio playback with real EQ support
  media_kit: ^1.1.10
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.0.9
  # State management
  provider: ^6.1.1
  # Path utilities
  path: ^1.8.3
  path_provider: ^2.1.1
  # Local storage
  shared_preferences: ^2.2.2
  # Database for caching
  sqflite: ^2.3.0
  # ID3 tag parsing
  id3: ^1.0.2
  # File picker for custom directories
  file_picker: ^8.0.0
  # Permission handling for mobile
  permission_handler: ^11.3.0
  # Media metadata reader for all audio formats
  flutter_media_metadata: ^1.0.0
  # Concurrency and background processing
  async: ^2.11.0
  # Device information
  device_info_plus: ^9.1.2
  # Media store access for Android 10+
  on_audio_query: ^2.9.0
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.41

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
